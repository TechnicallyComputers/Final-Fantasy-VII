format_version = 6
id = "ff7.expanded-party"
version = "0.1.0"
name = "Final Fantasy VII Expanded Party Research"
author = "Final Fantasy VII Recompiled project"
description = "Experimental independent-character registry with guarded PHS, equipment, materia, battle, progression and extended-save adapters. Full field assets, animations, limits and live gameplay acceptance remain unfinished."
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94163"

[[feature]]
id = "party-audit"
name = "Character storage audit (developer)"
channel = "developer"
description = "Read-only logging of character-name lookups and native record aliases, capped at 24 observations. Verifies executable bytes before reading. Does not unlock characters or change saves."
group = "Developer"
default_enabled = false

[[plugin]]
feature = "party-audit"
id = "ff7.party-audit"

[[feature]]
id = "party-access"
name = "Independent record queries (developer)"
channel = "developer"
description = "Guarded developer ABI for 16-bit extra-character name and equipment materia-slot queries using separate enhancement memory. Requires explicit host roster publication. Ordinary native calls and flashback ID10 remain stock; PHS/menu/battle caller conversion is not implemented."
group = "Developer"
default_enabled = false

[[plugin]]
feature = "party-access"
id = "ff7.party-access"

[[feature]]
id = "party-gameplay"
name = "Added-character gameplay integration (developer)"
channel = "developer"
description = "Experimental guest-owned roster, PHS, equipment/materia, battle, progression and save adapters. Separate records and stable saved identities support future additions. Field assets, complete motions/limits and live gameplay/save acceptance remain under development. Requires a fresh launch; leave disabled for ordinary play."
group = "Developer"
default_enabled = false

[[plugin]]
feature = "party-gameplay"
id = "ff7.party-gameplay"
