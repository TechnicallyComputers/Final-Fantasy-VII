[runtime]
# Enable the overlay loader: the shipped static shard / bundled overlay
# toolchain turn streamed overlays native instead of running them interpreted.
overlay_cache = true
window_title = "Final Fantasy 7 Recompiled"
memcard_dir = "saves"

[video]
renderer = "opengl"
aspect_ratio = "4:3"

# The Enhanced Renderer mod selects the aspect and resolution. These dormant
# settings select psxrecomp's enhanced native-wide compositor (the Tomba path),
# rather than the original projection-squash widescreen implementation.
[widescreen]
native_wide = true
adaptive_view = true
nw_hud_corners = false
nw_backdrop = false
nw_phase_backdrop = false
# FF7 has no sprite-tag helper configured, so without a gameplay detector
# ws_game_mode() is never true and gpu_ws_present_native_43() pillarboxes
# EVERY frame at 4:3 — the widescreen is engaged but never presented. The
# GTE activity identifies 3D frames. The renderer mod additionally recognizes
# the live FIELD.BIN image and retains authored 4:3 field composition until
# a verified background tile/camera adapter is implemented. FMV and full-2D
# screens retain the framework's native presentation policy.
# Runtime-only; no regen.
gte_game_mode = true

[controller]
default_mode = "digital"
lock_mode = true
allow_hybrid = false

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
multitap_analog = true
[netplay]
require_cue = true
required_tracks = 1
# Disc 1's fingerprint, kept for hosts that read only the flat key.
required_disc_fp = "23f1f7ab6a5327016a16783978fe49f94fb67814f4689f3c187612ece77418a3"
# Per-disc TOC fingerprints, parallel to [game] discs. Each disc has its own
# TOC, so gating the whole set on disc 1's would refuse online play on every
# other disc the launcher lets the player select. Same probe as disc_set.json.
required_disc_fps = [
  "23f1f7ab6a5327016a16783978fe49f94fb67814f4689f3c187612ece77418a3",
  "d1972bb6d776f89bbe543c3edf34fc4fa82b206fb90fb7dcd2c59c526324e616",
  "bdcefd0d9329b13097d29b004d51e893815e8923c975c4365a8509fc2b3a4ab9",
]
