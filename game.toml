# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "Final Fantasy 7"
id = "SCUS-94163"
players = 1
exe = "disc/SCUS_941.63"
# Verified as one program on N images (verify_disc_set.py).
# The launcher's Disc Selection dropdown offers all three; Play boots the
# selected one (settings.toml [disc] selected remembers which).
#
# Local, ignored disc images. Relative paths keep the three-disc set portable
# across development machines; players can select their own legal images in
# the launcher. Disc images are never included in source or release artifacts.
discs = [
    "disc/Final Fantasy VII (USA) (Disc 1).cue",
    "disc/Final Fantasy VII (USA) (Disc 2).cue",
    "disc/Final Fantasy VII (USA) (Disc 3).cue",
]
# Parallel to `discs`. Each disc of the set carries its OWN serial, so the
# launcher must verify the selected disc against this list rather than against
# [game] id (disc 1's) — otherwise picking Disc 2 reports "wrong disc".
# Values are verify_disc_set.py's per-disc probe (disc_set.json).
disc_serials = ["SCUS-94163", "SCUS-94164", "SCUS-94165"]
load_address = "0x80010000"
entry_pc = "0x800110C0"
text_size = "0x00060800"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Final Fantasy VII (USA) (Disc 1).bin"
cue_name = "Final Fantasy VII (USA) (Disc 1).cue"
boot_exe = "SCUS_941.63"
known_sizes = [747435024]
known_md5 = [
  "cce4e76d020b47847fe8e2f81ff613db",
]
known_sha1 = [
  "1f890164ac4daeba07def64bb5b636bfaa1d3ab9",
]
known_crc32 = [
  "1459cbef",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true

# Trusted game-mod entry hooks. The recompiler emits a psx_mod_function_entry()
# call at the top of each of these functions; src/ff7_mods.c registers callbacks
# against them. CHANGING THIS LIST REQUIRES A REGEN of generated/ — the call
# sites are baked into the emitted C.
#
# This list is DERIVED, not hand-maintained: it is every symbols.toml entry with
# hook = true. Regenerate/verify with
#   python3 tools/sync_symbols.py --check-hooks
# which prints this exact block on drift. Names come from the imported ff7-decomp
# map begin as status = "contextual". Promoted decoder/accessor hooks have
# independent original-binary oracle evidence in their implementation/tests.
mod_function_entry_funcs = [
    "0x80011C1C",  # main
    "0x80017108",  # Unzip
    "0x8001C434",  # SetupGamepad
    "0x80025040",  # SnapshotPartyLevels
    "0x800257CC",  # GetCharacterName
    "0x80025B10",  # SystemMenuRemovePartyGold
    "0x80025B48",  # SystemMenuAddPartyGold
    "0x80034BB0",  # SystemLzsDecompress (verified host decoder)
]

[runtime]
# Enable the overlay loader: the shipped static shard / bundled overlay
# toolchain turn streamed overlays native instead of running them interpreted.
overlay_cache = true
window_title = "Final Fantasy 7 Recompiled"
memcard_dir = "saves"

[video]
renderer = "opengl"
aspect_ratio = "4:3"

# The Widescreen mod selects the aspect (Internal Resolution the scale). These dormant
# settings select psxrecomp's enhanced native-wide compositor (the Tomba path),
# rather than the original projection-squash widescreen implementation.
[widescreen]
native_wide = true
adaptive_view = true
nw_hud_corners = false
nw_backdrop = false
nw_phase_backdrop = false
# FF7 has no sprite-tag helper configured, so without a gameplay detector
# ws_game_mode() is never true and gpu_ws_present_native_43() pillarboxes
# EVERY frame at 4:3 — the widescreen is engaged but never presented. The
# GTE activity identifies 3D frames. The renderer mod additionally recognizes
# the live FIELD.BIN image and retains authored 4:3 field composition until
# a verified background tile/camera adapter is implemented. FMV and full-2D
# screens retain the framework's native presentation policy.
# Runtime-only; no regen.
gte_game_mode = true

# World-map terrain (WORLD.BIN overlay, draw at 0x800BCB2C) flags each
# projected vertex with sltiu SX,0x140 / sltiu SY,0xF0 and drops polygons with
# no on-screen vertex, leaving the native-wide margins empty. The framework
# screen-extent detector widens such funnels to the wide window (identity at
# 4:3); FFVII's 240-line height immediate is 0xF0. Battle has no screen cull:
# its authored ground meshes end inside the 16:9 margins.
[widescreen.cull]
auto_screen_x = true
screen_h_imms = ["0xF0"]

# World-map sky quad (WORLD.BIN 0x800AE748): corners are MVMVA-rotated from a
# fixed +/-0xB4 half-width around screen centre (x -20..340), short of the
# native-wide margins. Both half-width constants move by the live margin.
[[widescreen.signed_x_bound]]
address = "0x800AE74C"
expected = "0x2404FF4C" # addiu a0,zero,-0xB4
[[widescreen.signed_x_bound]]
address = "0x800AE7A8"
expected = "0x340300B4" # ori v1,zero,0xB4

[controller]
default_mode = "digital"
lock_mode = true
allow_hybrid = false

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
multitap_analog = true
[netplay]
require_cue = true
required_tracks = 1
# Disc 1's fingerprint, kept for hosts that read only the flat key.
required_disc_fp = "23f1f7ab6a5327016a16783978fe49f94fb67814f4689f3c187612ece77418a3"
# Per-disc TOC fingerprints, parallel to [game] discs. Each disc has its own
# TOC, so gating the whole set on disc 1's would refuse online play on every
# other disc the launcher lets the player select. Same probe as disc_set.json.
required_disc_fps = [
  "23f1f7ab6a5327016a16783978fe49f94fb67814f4689f3c187612ece77418a3",
  "d1972bb6d776f89bbe543c3edf34fc4fa82b206fb90fb7dcd2c59c526324e616",
  "bdcefd0d9329b13097d29b004d51e893815e8923c975c4365a8509fc2b3a4ab9",
]
