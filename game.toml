strict = true

# Trusted game-mod entry hooks. The recompiler emits a psx_mod_function_entry()
# call at the top of each of these functions; src/ff7_mods.c registers callbacks
# against them. CHANGING THIS LIST REQUIRES A REGEN of generated/ — the call
# sites are baked into the emitted C.
#
# This list is DERIVED, not hand-maintained: it is every symbols.toml entry with
# hook = true. Regenerate/verify with
#   python3 tools/sync_symbols.py --check-hooks
# which prints this exact block on drift. Names come from the imported ff7-decomp
# map begin as status = "contextual". Promoted decoder/accessor hooks have
# independent original-binary oracle evidence in their implementation/tests.
